<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Drift is a personal habit tracker for building good habits and breaking bad ones, with weekly and monthly goals, streaks, and local backups.">
  <title>Drift — Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap" id="app">
    <header>
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Daily Ledger</p>
      <h1>Drift</h1>
      <p class="sub">Build what you want more of. Break what you don't. One day at a time.</p>

      <section class="banner" aria-label="Daily motivation">
        <div class="flame" id="flameIcon" aria-hidden="true">🔥</div>
        <div class="banner-text">
          <p class="banner-quote" id="quoteText">Loading today's nudge…</p>
          <p class="banner-meta" id="quoteMeta"></p>
        </div>
        <button type="button" class="banner-refresh" id="refreshQuote">NEW ONE →</button>
      </section>

      <form class="add-row" id="addHabitForm" autocomplete="off">
        <label class="sr-only" for="habitInput">Habit name</label>
        <input
          type="text"
          id="habitInput"
          name="habitName"
          placeholder="Add a habit — e.g. 'Read 10 pages' or 'No late-night scrolling'"
          maxlength="60"
          required
        >

        <div class="type-toggle" role="group" aria-label="Habit type">
          <button type="button" data-t="good" class="active" id="btnGood" aria-pressed="true">BUILDING</button>
          <button type="button" data-t="bad" id="btnBad" aria-pressed="false">BREAKING</button>
        </div>

        <label class="goal-field" for="weeklyGoalInput" title="Successful days per week (1–7)">
          <span>Week</span>
          <input type="number" id="weeklyGoalInput" name="weeklyGoal" min="1" max="7" value="7" inputmode="numeric" required>
        </label>

        <label class="goal-field" for="monthlyGoalInput" title="Successful days per month (1–31)">
          <span>Month</span>
          <input type="number" id="monthlyGoalInput" name="monthlyGoal" min="1" max="31" value="30" inputmode="numeric" required>
        </label>

        <button type="submit" class="add-btn" id="addBtn">ADD</button>
      </form>
    </header>

    <p id="statusMsg" class="status-msg" role="status">Loading your habits…</p>

    <main>
      <div class="columns" id="columns" hidden>
        <section aria-labelledby="buildingHeading">
          <h2 class="col-title good" id="buildingHeading"><span class="arrow" aria-hidden="true">↑</span> Building</h2>
          <div id="goodList"></div>
        </section>
        <section aria-labelledby="breakingHeading">
          <h2 class="col-title bad" id="breakingHeading"><span class="arrow" aria-hidden="true">↓</span> Breaking</h2>
          <div id="badList"></div>
        </section>
      </div>

      <section class="dashboard" id="dashboard" aria-label="Overview dashboard" hidden></section>

      <section class="stats" id="stats" aria-label="Quick stats" hidden></section>
    </main>

    <footer class="reset-row">
      <div class="backup-row">
        <button type="button" class="backup-btn" id="exportBtn">Export Backup</button>
        <button type="button" class="backup-btn" id="importBtn">Import Backup</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden aria-hidden="true">
      </div>
      <p class="backup-msg" id="backupMsg" role="status" aria-live="polite"></p>
      <button type="button" class="reset-link" id="resetBtn">clear all data</button>
    </footer>
  </div>

  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Replace current data?</h2>
      <p id="confirmBody">Importing a backup will replace all current habits and history. This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="confirmCancel">CANCEL</button>
        <button type="button" class="modal-confirm" id="confirmOk">REPLACE DATA</button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
