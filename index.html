<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift — Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#12141a;
    --void-2:#1a1d25;
    --slate:#20232d;
    --slate-2:#282c38;
    --hair:#333747;
    --bone:#e8e6de;
    --bone-dim:#9a9aa0;
    --moss:#7fa37b;
    --moss-dim:#3f4f3d;
    --ember:#c0563a;
    --ember-dim:#4a2e26;
    --gold:#d9a441;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(217,164,65,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(127,163,123,0.07), transparent 55%),
      var(--void);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    min-height:100%;
    padding:32px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  /* Header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:44px;
    letter-spacing:-.01em;
    line-height:1;
  }
  .sub{color:var(--bone-dim);font-size:15px;margin-top:8px;}

  /* Motivation banner */
  .banner{
    margin-top:22px;
    border:1px solid var(--hair);
    background:linear-gradient(135deg, rgba(217,164,65,0.08), rgba(127,163,123,0.05));
    border-radius:var(--radius);
    padding:20px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
    overflow:hidden;
  }
  .banner::before{
    content:"";
    position:absolute;
    left:-40px;top:-40px;
    width:140px;height:140px;
    background:radial-gradient(circle, rgba(217,164,65,0.18), transparent 70%);
  }
  .flame{
    flex-shrink:0;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    z-index:1;
  }
  .banner-text{flex:1;z-index:1;}
  .banner-quote{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-style:italic;
    line-height:1.4;
    color:var(--bone);
  }
  .banner-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--bone-dim);
    margin-top:6px;
    letter-spacing:.04em;
  }
  .banner-refresh{
    z-index:1;
    flex-shrink:0;
    background:var(--slate-2);
    border:1px solid var(--hair);
    color:var(--bone-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }
  .banner-refresh:hover{color:var(--gold);border-color:var(--gold);}

  /* Add habit form */
  .add-row{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .add-row input[type=text]{
    flex:1;
    min-width:200px;
    background:var(--slate);
    border:1px solid var(--hair);
    border-radius:10px;
    padding:13px 16px;
    color:var(--bone);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    transition:.15s;
  }
  .add-row input[type=text]:focus{border-color:var(--gold);}
  .add-row input[type=text]::placeholder{color:var(--bone-dim);}
  .type-toggle{
    display:flex;
    border:1px solid var(--hair);
    border-radius:10px;
    overflow:hidden;
  }
  .type-toggle button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    padding:0 16px;
    background:var(--slate);
    color:var(--bone-dim);
    border:none;
    cursor:pointer;
    transition:.15s;
  }
  .type-toggle button.active[data-t="good"]{background:var(--moss-dim);color:var(--moss);}
  .type-toggle button.active[data-t="bad"]{background:var(--ember-dim);color:var(--ember);}
  .goal-field{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:3px;
    background:var(--slate);
    border:1px solid var(--hair);
    border-radius:10px;
    padding:6px 10px 8px;
    min-width:72px;
  }
  .goal-field span{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:.08em;
    color:var(--bone-dim);
    text-transform:uppercase;
  }
  .goal-field input[type=number]{
    width:100%;
    background:transparent;
    border:none;
    color:var(--bone);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    outline:none;
    padding:0;
    -moz-appearance:textfield;
  }
  .goal-field input[type=number]::-webkit-outer-spin-button,
  .goal-field input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .goal-field input[type=number]:focus{color:var(--gold);}
  .add-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    background:var(--gold);
    color:var(--void);
    border:none;
    border-radius:10px;
    padding:0 20px;
    cursor:pointer;
    font-weight:600;
    transition:.15s;
  }
  .add-btn:hover{opacity:.88;}

  /* Columns */
  .columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-top:34px;
  }
  @media (max-width:720px){ .columns{grid-template-columns:1fr;} }

  .col-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .col-title.good{color:var(--moss);}
  .col-title.bad{color:var(--ember);}
  .col-title .arrow{font-size:14px;}

  .empty{
    border:1px dashed var(--hair);
    border-radius:var(--radius);
    padding:26px 18px;
    text-align:center;
    color:var(--bone-dim);
    font-size:13px;
    line-height:1.6;
  }

  /* Habit card */
  .card{
    background:var(--slate);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:14px;
    transition:.15s;
  }
  .card.good{border-left:3px solid var(--moss);}
  .card.bad{border-left:3px solid var(--ember);}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-name{font-size:15.5px;font-weight:600;line-height:1.3;}
  .card-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .streak-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .card.good .streak-pill{background:var(--moss-dim);color:var(--moss);}
  .card.bad .streak-pill{background:var(--ember-dim);color:var(--ember);}

  .hist-btn,
  .edit-btn,
  .del-btn{
    background:none;border:none;color:var(--bone-dim);
    cursor:pointer;font-size:15px;line-height:1;padding:4px;
    opacity:.5;transition:.15s;
  }
  .hist-btn{font-size:13px;letter-spacing:.02em;font-family:'IBM Plex Mono',monospace;}
  .hist-btn:hover,
  .hist-btn.active{opacity:1;color:var(--gold);}
  .edit-btn:hover{opacity:1;color:var(--gold);}
  .del-btn:hover{opacity:1;color:var(--ember);}

  /* Inline habit edit */
  .card-edit{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card-edit input[type=text]{
    width:100%;
    background:var(--void-2);
    border:1px solid var(--hair);
    border-radius:8px;
    padding:10px 12px;
    color:var(--bone);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    outline:none;
  }
  .card-edit input[type=text]:focus{border-color:var(--gold);}
  .card-edit-goals{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:stretch;
  }
  .card-edit .goal-field{flex:1;min-width:72px;}
  .card-edit-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    flex-wrap:wrap;
  }
  .card-edit-error{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ember);
    letter-spacing:.02em;
  }
  .edit-save,
  .edit-cancel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid var(--hair);
    transition:.15s;
  }
  .edit-save{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--void);
    font-weight:600;
  }
  .edit-save:hover{opacity:.88;}
  .edit-cancel{
    background:transparent;
    color:var(--bone-dim);
  }
  .edit-cancel:hover{color:var(--bone);border-color:var(--bone-dim);}

  /* wave / last-14 */
  .wave{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:26px;
    margin-top:14px;
  }
  .wave .tick{
    flex:1;
    border-radius:2px;
    background:var(--hair);
    height:6px;
    transition:height .2s;
  }
  .card.good .wave .tick.on{background:var(--moss);}
  .card.bad .wave .tick.on{background:var(--ember);}

  /* weekly / monthly progress */
  .progress-block{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .progress-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .progress-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--bone-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .progress-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--bone);
    letter-spacing:.02em;
  }
  .progress-track{
    height:4px;
    background:var(--hair);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:2px;
    width:0%;
    max-width:100%;
    transition:width .2s ease;
  }
  .card.good .progress-fill{background:var(--moss);}
  .card.bad .progress-fill{background:var(--ember);}
  .dash-fill{background:var(--gold);}

  .card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
  }
  .wave-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--bone-dim);letter-spacing:.04em;}

  .check-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:9px;
    border:1px solid var(--hair);
    background:transparent;
    color:var(--bone-dim);
    cursor:pointer;
    transition:.15s;
  }
  .card.good .check-btn.done{background:var(--moss);border-color:var(--moss);color:var(--void);font-weight:600;}
  .card.bad .check-btn.done{background:var(--ember);border-color:var(--ember);color:var(--void);font-weight:600;}
  .check-btn:hover{border-color:var(--gold);color:var(--gold);}
  .check-btn.done:hover{color:var(--void);}

  /* History calendar panel */
  .history-panel{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--hair);
  }
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .cal-nav-btn{
    background:var(--void-2);
    border:1px solid var(--hair);
    color:var(--bone-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }
  .cal-nav-btn:hover{color:var(--gold);border-color:var(--gold);}
  .cal-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    text-align:center;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .cal-dow{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:.06em;
    color:var(--bone-dim);
    text-align:center;
    padding:4px 0 6px;
  }
  .cal-day{
    aspect-ratio:1;
    min-height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--bone-dim);
    background:transparent;
  }
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{
    box-shadow:inset 0 0 0 1px var(--gold);
    color:var(--bone);
  }
  .card.good .cal-day.logged{
    background:var(--moss-dim);
    color:var(--moss);
    font-weight:600;
  }
  .card.bad .cal-day.logged{
    background:var(--ember-dim);
    color:var(--ember);
    font-weight:600;
  }
  .card.good .cal-day.logged.today{
    box-shadow:inset 0 0 0 1px rgba(127,163,123,0.7);
  }
  .card.bad .cal-day.logged.today{
    box-shadow:inset 0 0 0 1px rgba(192,86,58,0.7);
  }
  .cal-note{
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--bone-dim);
    letter-spacing:.04em;
  }

  /* Dashboard */
  .dashboard{
    margin-top:34px;
    border:1px solid var(--hair);
    border-radius:var(--radius);
    background:var(--slate);
    padding:20px 18px 16px;
  }
  .dashboard-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:16px;
  }
  .dash-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  @media (max-width:720px){
    .dash-grid{grid-template-columns:1fr;}
  }
  .dash-panel{
    background:var(--void-2);
    border:1px solid var(--hair);
    border-radius:12px;
    padding:14px;
  }
  .dash-panel h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--bone-dim);
    margin-bottom:12px;
  }
  .dash-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
  }
  .dash-row .k{
    font-size:12px;
    color:var(--bone-dim);
  }
  .dash-row .v{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--bone);
    font-weight:600;
  }
  .dash-bar-wrap{margin-top:10px;}
  .dash-bar-wrap .progress-meta{margin-bottom:5px;}
  .dash-consistent{
    margin-top:4px;
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--bone);
    line-height:1.3;
  }
  .dash-consistent-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--bone-dim);
    margin-top:4px;
    letter-spacing:.04em;
  }

  /* Footer stats */
  .stats{
    margin-top:28px;
    border-top:1px solid var(--hair);
    padding-top:22px;
    display:flex;
    gap:32px;
    flex-wrap:wrap;
  }
  .stat{font-family:'IBM Plex Mono',monospace;}
  .stat .num{font-size:26px;color:var(--gold);font-weight:600;}
  .stat .lbl{font-size:11px;color:var(--bone-dim);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

  .status-msg{
    text-align:center;
    color:var(--bone-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:40px 0;
  }

  footer.reset-row{
    margin-top:40px;
    text-align:center;
  }
  .backup-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .backup-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.05em;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--hair);
    background:var(--slate-2);
    color:var(--bone-dim);
    cursor:pointer;
    transition:.15s;
  }
  .backup-btn:hover{color:var(--gold);border-color:var(--gold);}
  .backup-msg{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    margin-bottom:12px;
    min-height:1em;
  }
  .backup-msg.error{color:var(--ember);}
  .backup-msg.ok{color:var(--moss);}
  .reset-link{
    background:none;border:none;color:var(--bone-dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-decoration:underline;cursor:pointer;opacity:.6;
  }
  .reset-link:hover{opacity:1;color:var(--ember);}

  /* Custom confirm modal */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,12,16,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }
  .modal-backdrop[hidden]{display:none !important;}
  .modal{
    width:100%;
    max-width:420px;
    background:var(--slate);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    padding:22px 20px 18px;
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    margin-bottom:8px;
  }
  .modal p{
    color:var(--bone-dim);
    font-size:14px;
    line-height:1.5;
    margin-bottom:18px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
  }
  .modal-cancel,
  .modal-confirm{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid var(--hair);
  }
  .modal-cancel{
    background:transparent;
    color:var(--bone-dim);
  }
  .modal-cancel:hover{color:var(--bone);}
  .modal-confirm{
    background:var(--ember);
    border-color:var(--ember);
    color:var(--void);
    font-weight:600;
  }
  .modal-confirm:hover{opacity:.9;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="eyebrow"><span class="dot"></span>DAILY LEDGER</div>
    <h1>Drift</h1>
    <p class="sub">Build what you want more of. Break what you don't. One day at a time.</p>

    <div class="banner">
      <div class="flame" id="flameIcon">🔥</div>
      <div class="banner-text">
        <div class="banner-quote" id="quoteText">Loading today's nudge…</div>
        <div class="banner-meta" id="quoteMeta"></div>
      </div>
      <button class="banner-refresh" id="refreshQuote">NEW ONE →</button>
    </div>

    <div class="add-row">
      <input type="text" id="habitInput" placeholder="Add a habit — e.g. 'Read 10 pages' or 'No late-night scrolling'" maxlength="60">
      <div class="type-toggle">
        <button data-t="good" class="active" id="btnGood">BUILDING</button>
        <button data-t="bad" id="btnBad">BREAKING</button>
      </div>
      <label class="goal-field" title="Successful days per week (1–7)">
        <span>Week</span>
        <input type="number" id="weeklyGoalInput" min="1" max="7" value="7" inputmode="numeric">
      </label>
      <label class="goal-field" title="Successful days per month (1–31)">
        <span>Month</span>
        <input type="number" id="monthlyGoalInput" min="1" max="31" value="30" inputmode="numeric">
      </label>
      <button class="add-btn" id="addBtn">ADD</button>
    </div>
  </header>

  <div id="statusMsg" class="status-msg">Loading your habits…</div>

  <div class="columns" id="columns" style="display:none;">
    <div>
      <div class="col-title good"><span class="arrow">↑</span> BUILDING</div>
      <div id="goodList"></div>
    </div>
    <div>
      <div class="col-title bad"><span class="arrow">↓</span> BREAKING</div>
      <div id="badList"></div>
    </div>
  </div>

  <div class="dashboard" id="dashboard" style="display:none;"></div>

  <div class="stats" id="stats" style="display:none;"></div>

  <footer class="reset-row">
    <div class="backup-row">
      <button type="button" class="backup-btn" id="exportBtn">Export Backup</button>
      <button type="button" class="backup-btn" id="importBtn">Import Backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="backup-msg" id="backupMsg"></div>
    <button class="reset-link" id="resetBtn">clear all data</button>
  </footer>
</div>

<div class="modal-backdrop" id="confirmModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Replace current data?</h2>
    <p id="confirmBody">Importing a backup will replace all current habits and history. This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="confirmCancel">CANCEL</button>
      <button type="button" class="modal-confirm" id="confirmOk">REPLACE DATA</button>
    </div>
  </div>
</div>

<script>
const QUOTES = [
  "Progress is a whisper repeated daily, not a shout said once.",
  "You don't rise to your goals, you fall to your systems.",
  "The habit doesn't care how you feel about it today. Show up anyway.",
  "Small and consistent beats big and occasional, every time.",
  "Every day you don't quit is a day you're becoming who you want to be.",
  "The bad habit doesn't disappear — it gets outcompeted. Keep starving it.",
  "You're not starting over. You're continuing from wherever you are.",
  "One rep, one page, one clean day. That's the whole job today.",
  "Discipline is choosing between what you want now and what you want most.",
  "The streak isn't the point. Who you're becoming is.",
  "Motivation gets you started. The habit is what keeps you going.",
  "You already know what to do. Today's task is just doing it.",
  "Boring, repeated action wins. It always has.",
  "Don't break the chain — even a small link holds.",
  "The days you don't feel like it are the days that count most.",
  "You're one decision away from a different day.",
  "Cravings pass whether you feed them or not. Let this one pass.",
  "Future you is built entirely out of what today-you decides.",
  "Slip-ups aren't failures — stopping is. Get back on today.",
  "Identity follows action. Act like who you're trying to become."
];

const DEFAULT_WEEKLY_GOAL = 7;
const DEFAULT_MONTHLY_GOAL = 30;
const BACKUP_VERSION = 1;
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LABELS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

let habits = [];
let selectedType = 'good';
let dataReady = false;
let editingId = null;
let historyId = null;
let historyCursor = null; // { year, month } month is 0-11
let pendingImportHabits = null;
let confirmResolver = null;

const $ = (id) => document.getElementById(id);

/** Format a Date as local YYYY-MM-DD (never UTC / toISOString). */
function localDateStr(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

/** Today's local calendar date, optionally shifted by whole days. */
function todayStr(offset=0){
  const d = new Date();
  d.setHours(12, 0, 0, 0); // noon avoids DST edge cases when shifting days
  d.setDate(d.getDate() - offset);
  return localDateStr(d);
}

function uid(){ return 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function getWeeklyGoal(h){
  const g = Number(h && h.weeklyGoal);
  if(Number.isInteger(g) && g >= 1 && g <= 7) return g;
  return DEFAULT_WEEKLY_GOAL;
}

function getMonthlyGoal(h){
  const g = Number(h && h.monthlyGoal);
  if(Number.isInteger(g) && g >= 1 && g <= 31) return g;
  return DEFAULT_MONTHLY_GOAL;
}

function parseWeeklyGoal(value){
  const n = parseInt(String(value).trim(), 10);
  if(!Number.isInteger(n) || n < 1 || n > 7) return null;
  return n;
}

function parseMonthlyGoal(value){
  const n = parseInt(String(value).trim(), 10);
  if(!Number.isInteger(n) || n < 1 || n > 31) return null;
  return n;
}

/** Monday (local) of the current week at noon. */
function startOfCurrentWeek(){
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  const day = d.getDay(); // 0=Sun … 6=Sat
  const mondayOffset = day === 0 ? 6 : day - 1;
  d.setDate(d.getDate() - mondayOffset);
  return d;
}

function endOfCurrentWeek(){
  const d = startOfCurrentWeek();
  d.setDate(d.getDate() + 6);
  return d;
}

function startOfCurrentMonth(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1, 12, 0, 0, 0);
}

function endOfCurrentMonth(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + 1, 0, 12, 0, 0, 0);
}

/** Later of two dates (local noon copies). */
function minDate(a, b){
  return a.getTime() <= b.getTime() ? a : b;
}

/** Count successful logged calendar days in [start, end], each day once. */
function countLoggedDays(h, startDate, endDate){
  if(!h || !h.log) return 0;
  let count = 0;
  const d = new Date(startDate.getTime());
  d.setHours(12, 0, 0, 0);
  const end = new Date(endDate.getTime());
  end.setHours(12, 0, 0, 0);
  while(d <= end){
    if(h.log[localDateStr(d)]) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function weeklyProgress(h){
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const end = minDate(endOfCurrentWeek(), today); // don't count future days
  const done = countLoggedDays(h, startOfCurrentWeek(), end);
  const goal = getWeeklyGoal(h);
  return { done, goal };
}

function monthlyProgress(h){
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const end = minDate(endOfCurrentMonth(), today); // don't count future days
  const done = countLoggedDays(h, startOfCurrentMonth(), end);
  const goal = getMonthlyGoal(h);
  return { done, goal };
}

function progressPct(done, goal){
  if(!goal || goal <= 0) return 0;
  return Math.min(100, Math.round((done / goal) * 100));
}

/** Ensure existing habits without goals keep working; never wipe log/history or regenerate ids. */
function normalizeHabit(h){
  const log = (h && h.log && typeof h.log === 'object' && !Array.isArray(h.log)) ? h.log : {};
  return {
    ...h,
    name: typeof (h && h.name) === 'string' ? h.name : '',
    type: h && h.type === 'bad' ? 'bad' : 'good',
    log,
    createdAt: (h && h.createdAt) || todayStr(0),
    weeklyGoal: !h || h.weeklyGoal == null ? DEFAULT_WEEKLY_GOAL : getWeeklyGoal(h),
    monthlyGoal: !h || h.monthlyGoal == null ? DEFAULT_MONTHLY_GOAL : getMonthlyGoal(h)
  };
}

// ---------- Storage ----------
function loadHabits() {
  try {
    const savedHabits = localStorage.getItem('drift-habits');
    const parsed = savedHabits ? JSON.parse(savedHabits) : [];
    habits = Array.isArray(parsed) ? parsed.map(normalizeHabit) : [];
  } catch (e) {
    console.error('Load failed', e);
    habits = [];
  }
}

function saveHabits() {
  try {
    localStorage.setItem('drift-habits', JSON.stringify(habits));
  } catch (e) {
    console.error('Save failed', e);

    $('statusMsg').style.display = 'block';
    $('statusMsg').textContent =
      "Couldn't save — your last change may not persist.";

    setTimeout(() => {
      $('statusMsg').style.display = 'none';
    }, 3000);
  }
}

// ---------- Streak / wave logic ----------
function currentStreak(h){
  let streak = 0;
  let offset = 0;
  // if today not logged yet, start counting from yesterday
  if(!h.log[todayStr(0)]) offset = 1;
  while(h.log[todayStr(offset)]){
    streak++;
    offset++;
  }
  return streak;
}

function last14(h){
  const arr = [];
  for(let i=13;i>=0;i--){
    arr.push(!!h.log[todayStr(i)]);
  }
  return arr;
}

function checkMilestone(h){
  const s = currentStreak(h);
  const milestones = [3,7,14,30,60,100];
  return milestones.includes(s) ? s : null;
}

// ---------- Dashboard metrics ----------
function aggregateProgress(progressFn){
  let completions = 0;
  let goalsMet = 0;
  let target = 0;
  let achieved = 0;
  habits.forEach(h => {
    const p = progressFn(h);
    completions += p.done;
    target += p.goal;
    achieved += p.done;
    if(p.done >= p.goal) goalsMet++;
  });
  const pct = progressPct(achieved, target);
  return { completions, goalsMet, pct, target, achieved };
}

function mostConsistentThisMonth(){
  if(habits.length === 0) return null;
  let best = null;
  habits.forEach(h => {
    const p = monthlyProgress(h);
    const pct = p.goal ? (p.done / p.goal) : 0;
    const candidate = { habit: h, done: p.done, goal: p.goal, pct };
    if(!best){
      best = candidate;
      return;
    }
    if(candidate.pct > best.pct ||
       (candidate.pct === best.pct && candidate.done > best.done) ||
       (candidate.pct === best.pct && candidate.done === best.done && candidate.habit.name.localeCompare(best.habit.name) < 0)){
      best = candidate;
    }
  });
  return best;
}

// ---------- Calendar helpers ----------
function buildMonthCells(year, month){
  const first = new Date(year, month, 1, 12, 0, 0, 0);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const sunBased = first.getDay(); // 0=Sun
  const mondayOffset = sunBased === 0 ? 6 : sunBased - 1;
  const cells = [];
  for(let i = 0; i < mondayOffset; i++) cells.push(null);
  for(let d = 1; d <= daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function shiftHistoryMonth(delta){
  if(!historyCursor) return;
  let y = historyCursor.year;
  let m = historyCursor.month + delta;
  while(m < 0){ m += 12; y -= 1; }
  while(m > 11){ m -= 12; y += 1; }
  historyCursor = { year: y, month: m };
  render();
}

// ---------- Rendering ----------
function render(){
  const goodList = $('goodList');
  const badList = $('badList');
  goodList.innerHTML = '';
  badList.innerHTML = '';

  const good = habits.filter(h => h.type === 'good');
  const bad = habits.filter(h => h.type === 'bad');

  if(good.length === 0){
    goodList.innerHTML = '<div class="empty">No habits yet. Add something you want to start doing.</div>';
  } else {
    good.forEach(h => goodList.appendChild(renderCard(h)));
  }

  if(bad.length === 0){
    badList.innerHTML = '<div class="empty">No habits yet. Add something you want to quit.</div>';
  } else {
    bad.forEach(h => badList.appendChild(renderCard(h)));
  }

  renderDashboard();
  renderStats();
}

function renderProgressItem(label, done, goal, fillClass){
  const item = document.createElement('div');
  item.className = 'progress-item';
  const pct = progressPct(done, goal);
  item.innerHTML = `
    <div class="progress-meta">
      <span class="progress-label">${label}</span>
      <span class="progress-count">${done} / ${goal}</span>
    </div>
    <div class="progress-track"><div class="progress-fill ${fillClass || ''}" style="width:${pct}%"></div></div>
  `;
  return item;
}

function renderCard(h){
  const card = document.createElement('div');
  card.className = 'card ' + h.type;

  if(editingId === h.id){
    card.appendChild(renderCardEditor(h));
    return card;
  }

  const streak = currentStreak(h);
  const doneToday = !!h.log[todayStr(0)];
  const wave = last14(h);
  const week = weeklyProgress(h);
  const month = monthlyProgress(h);
  const historyOpen = historyId === h.id;

  const top = document.createElement('div');
  top.className = 'card-top';
  top.innerHTML = `
    <div class="card-name">${escapeHtml(h.name)}</div>
    <div class="card-actions">
      <span class="streak-pill">${streak} day${streak===1?'':'s'}</span>
      <button class="hist-btn${historyOpen ? ' active' : ''}" title="History" aria-label="History" aria-expanded="${historyOpen}">▣</button>
      <button class="edit-btn" title="Edit habit" aria-label="Edit habit">✎</button>
      <button class="del-btn" title="Delete habit" aria-label="Delete habit">✕</button>
    </div>
  `;
  top.querySelector('.hist-btn').addEventListener('click', () => toggleHistory(h.id));
  top.querySelector('.edit-btn').addEventListener('click', () => editHabit(h.id));
  top.querySelector('.del-btn').addEventListener('click', () => deleteHabit(h.id));
  card.appendChild(top);

  const waveEl = document.createElement('div');
  waveEl.className = 'wave';
  wave.forEach(on => {
    const t = document.createElement('div');
    t.className = 'tick' + (on ? ' on' : '');
    t.style.height = on ? '100%' : '20%';
    waveEl.appendChild(t);
  });
  card.appendChild(waveEl);

  const progress = document.createElement('div');
  progress.className = 'progress-block';
  progress.appendChild(renderProgressItem('Weekly', week.done, week.goal));
  progress.appendChild(renderProgressItem('Monthly', month.done, month.goal));
  card.appendChild(progress);

  const bottom = document.createElement('div');
  bottom.className = 'card-bottom';
  bottom.innerHTML = `<span class="wave-label">LAST 14 DAYS</span>`;
  const btn = document.createElement('button');
  btn.className = 'check-btn' + (doneToday ? ' done' : '');
  btn.textContent = doneToday
    ? (h.type === 'good' ? '✓ DONE TODAY' : '✓ STAYED CLEAN')
    : (h.type === 'good' ? 'MARK DONE' : 'MARK CLEAN');
  btn.addEventListener('click', () => toggleToday(h.id));
  bottom.appendChild(btn);
  card.appendChild(bottom);

  if(historyOpen){
    card.appendChild(renderHistoryPanel(h));
  }

  return card;
}

function renderHistoryPanel(h){
  if(!historyCursor){
    const now = new Date();
    historyCursor = { year: now.getFullYear(), month: now.getMonth() };
  }

  const { year, month } = historyCursor;
  const today = todayStr(0);
  const cells = buildMonthCells(year, month);
  const loggedCount = countLoggedDays(
    h,
    new Date(year, month, 1, 12, 0, 0, 0),
    new Date(year, month + 1, 0, 12, 0, 0, 0)
  );

  const panel = document.createElement('div');
  panel.className = 'history-panel';

  const nav = document.createElement('div');
  nav.className = 'cal-nav';
  nav.innerHTML = `
    <button type="button" class="cal-nav-btn" aria-label="Previous month">‹</button>
    <div class="cal-title">${MONTH_NAMES[month]} ${year}</div>
    <button type="button" class="cal-nav-btn" aria-label="Next month">›</button>
  `;
  const navBtns = nav.querySelectorAll('.cal-nav-btn');
  navBtns[0].addEventListener('click', () => shiftHistoryMonth(-1));
  navBtns[1].addEventListener('click', () => shiftHistoryMonth(1));
  panel.appendChild(nav);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  DOW_LABELS.forEach(label => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = label;
    grid.appendChild(el);
  });

  cells.forEach(day => {
    const el = document.createElement('div');
    if(day == null){
      el.className = 'cal-day empty';
      grid.appendChild(el);
      return;
    }
    const date = new Date(year, month, day, 12, 0, 0, 0);
    const key = localDateStr(date);
    const logged = !!h.log[key];
    const isToday = key === today;
    el.className = 'cal-day' + (logged ? ' logged' : '') + (isToday ? ' today' : '');
    el.textContent = String(day);
    el.title = key + (logged ? ' · logged' : '');
    grid.appendChild(el);
  });
  panel.appendChild(grid);

  const note = document.createElement('div');
  note.className = 'cal-note';
  note.textContent = `${loggedCount} successful day${loggedCount === 1 ? '' : 's'} this month · view only`;
  panel.appendChild(note);

  return panel;
}

function renderCardEditor(h){
  const form = document.createElement('div');
  form.className = 'card-edit';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.maxLength = 60;
  nameInput.value = h.name;
  nameInput.setAttribute('aria-label', 'Habit name');
  form.appendChild(nameInput);

  const goals = document.createElement('div');
  goals.className = 'card-edit-goals';
  goals.innerHTML = `
    <label class="goal-field" title="Successful days per week (1–7)">
      <span>Week</span>
      <input type="number" class="edit-weekly" min="1" max="7" inputmode="numeric" aria-label="Weekly goal">
    </label>
    <label class="goal-field" title="Successful days per month (1–31)">
      <span>Month</span>
      <input type="number" class="edit-monthly" min="1" max="31" inputmode="numeric" aria-label="Monthly goal">
    </label>
  `;
  const weeklyInput = goals.querySelector('.edit-weekly');
  const monthlyInput = goals.querySelector('.edit-monthly');
  weeklyInput.value = String(getWeeklyGoal(h));
  monthlyInput.value = String(getMonthlyGoal(h));
  form.appendChild(goals);

  const errorEl = document.createElement('div');
  errorEl.className = 'card-edit-error';
  errorEl.style.display = 'none';
  form.appendChild(errorEl);

  const actions = document.createElement('div');
  actions.className = 'card-edit-actions';
  actions.innerHTML = `
    <button type="button" class="edit-cancel">CANCEL</button>
    <button type="button" class="edit-save">SAVE</button>
  `;
  actions.querySelector('.edit-cancel').addEventListener('click', cancelEditHabit);
  actions.querySelector('.edit-save').addEventListener('click', () => {
    const name = nameInput.value.trim();
    if(!name){
      errorEl.style.display = 'block';
      errorEl.textContent = 'Habit name cannot be blank.';
      nameInput.focus();
      return;
    }

    const weeklyGoal = parseWeeklyGoal(weeklyInput.value);
    if(weeklyGoal === null){
      errorEl.style.display = 'block';
      errorEl.textContent = 'Weekly goal must be a whole number from 1 to 7.';
      weeklyInput.focus();
      return;
    }

    const monthlyGoal = parseMonthlyGoal(monthlyInput.value);
    if(monthlyGoal === null){
      errorEl.style.display = 'block';
      errorEl.textContent = 'Monthly goal must be a whole number from 1 to 31.';
      monthlyInput.focus();
      return;
    }

    saveEditedHabit(h.id, name, weeklyGoal, monthlyGoal);
  });
  form.appendChild(actions);

  queueMicrotask(() => nameInput.focus());

  return form;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderDashboard(){
  const el = $('dashboard');
  if(habits.length === 0){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'block';

  const week = aggregateProgress(weeklyProgress);
  const month = aggregateProgress(monthlyProgress);
  const bestStreak = habits.reduce((m, h) => Math.max(m, currentStreak(h)), 0);
  const consistent = mostConsistentThisMonth();

  el.innerHTML = `
    <div class="dashboard-title">Overview</div>
    <div class="dash-grid">
      <div class="dash-panel" id="dashWeek"></div>
      <div class="dash-panel" id="dashMonth"></div>
      <div class="dash-panel" id="dashConsistency"></div>
    </div>
  `;

  const weekPanel = el.querySelector('#dashWeek');
  weekPanel.innerHTML = `<h3>This Week</h3>`;
  weekPanel.appendChild(dashRow('Completions', String(week.completions)));
  weekPanel.appendChild(dashRow('Weekly goals', `${week.goalsMet}/${habits.length}`));
  weekPanel.appendChild(dashRow('Completion', `${week.pct}%`));
  const weekBar = document.createElement('div');
  weekBar.className = 'dash-bar-wrap';
  weekBar.appendChild(renderProgressItem('Toward weekly goals', week.achieved, week.target, 'dash-fill'));
  weekPanel.appendChild(weekBar);

  const monthPanel = el.querySelector('#dashMonth');
  monthPanel.innerHTML = `<h3>This Month</h3>`;
  monthPanel.appendChild(dashRow('Completions', String(month.completions)));
  monthPanel.appendChild(dashRow('Monthly goals', `${month.goalsMet}/${habits.length}`));
  monthPanel.appendChild(dashRow('Completion', `${month.pct}%`));
  const monthBar = document.createElement('div');
  monthBar.className = 'dash-bar-wrap';
  monthBar.appendChild(renderProgressItem('Toward monthly goals', month.achieved, month.target, 'dash-fill'));
  monthPanel.appendChild(monthBar);

  const consPanel = el.querySelector('#dashConsistency');
  consPanel.innerHTML = `<h3>Consistency</h3>`;
  consPanel.appendChild(dashRow('Best active streak', `${bestStreak} day${bestStreak === 1 ? '' : 's'}`));
  const label = document.createElement('div');
  label.className = 'dash-row';
  label.innerHTML = `<span class="k">Most consistent</span>`;
  consPanel.appendChild(label);
  if(consistent){
    const name = document.createElement('div');
    name.className = 'dash-consistent';
    name.textContent = consistent.habit.name;
    consPanel.appendChild(name);
    const meta = document.createElement('div');
    meta.className = 'dash-consistent-meta';
    meta.textContent = `${consistent.done} / ${consistent.goal} this month · ${progressPct(consistent.done, consistent.goal)}%`;
    consPanel.appendChild(meta);
  } else {
    const name = document.createElement('div');
    name.className = 'dash-consistent';
    name.textContent = '—';
    consPanel.appendChild(name);
  }
}

function dashRow(k, v){
  const row = document.createElement('div');
  row.className = 'dash-row';
  row.innerHTML = `<span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span>`;
  return row;
}

function renderStats(){
  const statsEl = $('stats');
  if(habits.length === 0){ statsEl.style.display = 'none'; return; }
  statsEl.style.display = 'flex';

  const totalHabits = habits.length;
  const doneTodayCount = habits.filter(h => h.log[todayStr(0)]).length;
  const longest = habits.reduce((m,h) => Math.max(m, currentStreak(h)), 0);

  const weeklyMet = habits.filter(h => {
    const p = weeklyProgress(h);
    return p.done >= p.goal;
  }).length;

  const monthlyMet = habits.filter(h => {
    const p = monthlyProgress(h);
    return p.done >= p.goal;
  }).length;

  statsEl.innerHTML = `
    <div class="stat"><div class="num">${doneTodayCount}/${totalHabits}</div><div class="lbl">Done today</div></div>
    <div class="stat"><div class="num">${weeklyMet}/${totalHabits}</div><div class="lbl">Weekly goals</div></div>
    <div class="stat"><div class="num">${monthlyMet}/${totalHabits}</div><div class="lbl">Monthly goals</div></div>
    <div class="stat"><div class="num">${longest}</div><div class="lbl">Longest active streak</div></div>
  `;
}

// ---------- Actions ----------
async function toggleToday(id){
  const h = habits.find(x => x.id === id);
  if(!h) return;
  const t = todayStr(0);
  h.log[t] = !h.log[t];
  render();
  await saveHabits();

  const milestone = checkMilestone(h);
  if(milestone && h.log[t]){
    showQuote(`${milestone}-day streak on "${h.name}" — that's momentum. Don't stop now.`, true);
  }
}

async function deleteHabit(id){
  if(editingId === id) editingId = null;
  if(historyId === id){
    historyId = null;
    historyCursor = null;
  }
  habits = habits.filter(h => h.id !== id);
  render();
  await saveHabits();
}

function editHabit(id){
  const h = habits.find(x => x.id === id);
  if(!h) return;
  if(historyId === id){
    historyId = null;
    historyCursor = null;
  }
  editingId = id;
  render();
}

function cancelEditHabit(){
  editingId = null;
  render();
}

function saveEditedHabit(id, name, weeklyGoal, monthlyGoal){
  const h = habits.find(x => x.id === id);
  if(!h) return;

  // Preserve log/history, streak data, createdAt, and Building/Breaking type
  h.name = name;
  h.weeklyGoal = weeklyGoal;
  h.monthlyGoal = monthlyGoal;
  editingId = null;
  render();
  saveHabits();
}

function toggleHistory(id){
  const h = habits.find(x => x.id === id);
  if(!h) return;

  if(historyId === id){
    historyId = null;
    historyCursor = null;
    render();
    return;
  }

  editingId = null;
  historyId = id;
  const now = new Date();
  historyCursor = { year: now.getFullYear(), month: now.getMonth() };
  render();
}

async function addHabit(){
  const input = $('habitInput');
  const name = input.value.trim();
  if(!name){
    setBackupMsg('Habit name cannot be blank.', true);
    return;
  }

  const weeklyGoal = parseWeeklyGoal($('weeklyGoalInput').value);
  if(weeklyGoal === null){
    setBackupMsg('Weekly goal must be a whole number from 1 to 7.', true);
    return;
  }

  const monthlyGoal = parseMonthlyGoal($('monthlyGoalInput').value);
  if(monthlyGoal === null){
    setBackupMsg('Monthly goal must be a whole number from 1 to 31.', true);
    return;
  }

  habits.push({
    id: uid(),
    name,
    type: selectedType,
    log: {},
    createdAt: todayStr(0),
    weeklyGoal,
    monthlyGoal
  });
  input.value = '';
  $('weeklyGoalInput').value = String(DEFAULT_WEEKLY_GOAL);
  $('monthlyGoalInput').value = String(DEFAULT_MONTHLY_GOAL);
  setBackupMsg('');
  render();
  await saveHabits();
}

// ---------- Backup export / import ----------
function setBackupMsg(text, isError){
  const el = $('backupMsg');
  el.textContent = text || '';
  el.className = 'backup-msg' + (text ? (isError ? ' error' : ' ok') : '');
}

function exportBackup(){
  const payload = {
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    appName: 'Drift',
    habits: habits.map(h => ({
      id: h.id,
      name: h.name,
      type: h.type,
      weeklyGoal: getWeeklyGoal(h),
      monthlyGoal: getMonthlyGoal(h),
      log: h.log || {},
      createdAt: h.createdAt
    }))
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `drift-backup-${todayStr(0)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setBackupMsg('Backup exported.', false);
}

function isUsableHabit(raw){
  if(!raw || typeof raw !== 'object') return false;
  if(typeof raw.name !== 'string' || !raw.name.trim()) return false;
  if(raw.type != null && raw.type !== 'good' && raw.type !== 'bad') return false;
  if(raw.log != null && (typeof raw.log !== 'object' || Array.isArray(raw.log))) return false;
  if(raw.id != null && typeof raw.id !== 'string') return false;
  return true;
}

function parseBackupPayload(text){
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error('File is not valid JSON.');
  }

  let list = null;
  if(Array.isArray(data)){
    list = data;
  } else if(data && typeof data === 'object' && Array.isArray(data.habits)){
    list = data.habits;
  } else {
    throw new Error('Backup must include a habits array.');
  }

  if(!list.every(isUsableHabit)){
    throw new Error('One or more habits are missing usable id/name/type/log data.');
  }

  // Normalize without mutating until confirmed; preserve ids/logs
  return list.map(h => {
    const normalized = normalizeHabit({
      id: (typeof h.id === 'string' && h.id) ? h.id : uid(),
      name: h.name.trim(),
      type: h.type === 'bad' ? 'bad' : 'good',
      log: h.log || {},
      createdAt: h.createdAt,
      weeklyGoal: h.weeklyGoal,
      monthlyGoal: h.monthlyGoal
    });
    return normalized;
  });
}

function openConfirmModal(title, body){
  return new Promise(resolve => {
    confirmResolver = resolve;
    $('confirmTitle').textContent = title;
    $('confirmBody').textContent = body;
    $('confirmModal').hidden = false;
  });
}

function closeConfirmModal(result){
  $('confirmModal').hidden = true;
  const resolve = confirmResolver;
  confirmResolver = null;
  if(resolve) resolve(result);
}

async function handleImportFile(file){
  if(!file) return;
  setBackupMsg('');

  let text;
  try {
    text = await file.text();
  } catch (e) {
    setBackupMsg('Could not read the selected file.', true);
    return;
  }

  let imported;
  try {
    imported = parseBackupPayload(text);
  } catch (e) {
    setBackupMsg(e.message || 'Invalid backup file.', true);
    return;
  }

  pendingImportHabits = imported;
  const ok = await openConfirmModal(
    'Replace current data?',
    `Import ${imported.length} habit${imported.length === 1 ? '' : 's'} from this backup? This will replace all current habits and history.`
  );

  if(!ok){
    pendingImportHabits = null;
    setBackupMsg('Import cancelled. Your current data was not changed.', false);
    return;
  }

  habits = pendingImportHabits;
  pendingImportHabits = null;
  editingId = null;
  historyId = null;
  historyCursor = null;
  saveHabits();
  render();
  setBackupMsg(`Imported ${habits.length} habit${habits.length === 1 ? '' : 's'} successfully.`, false);
}

// ---------- Motivation banner ----------
function dayIndexSeed(){
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function showQuote(text, isMilestone){
  $('quoteText').textContent = text;
  $('flameIcon').textContent = isMilestone ? '⭐' : '🔥';
  $('quoteMeta').textContent = isMilestone ? 'MILESTONE' : new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

function showTodaysQuote(){
  const idx = dayIndexSeed() % QUOTES.length;
  showQuote(QUOTES[idx], false);
}

function showRandomQuote(){
  const idx = Math.floor(Math.random() * QUOTES.length);
  showQuote(QUOTES[idx], false);
}

// ---------- Init ----------
async function init(){
  showTodaysQuote();

  await loadHabits();
  dataReady = true;
  $('statusMsg').style.display = 'none';
  $('columns').style.display = 'grid';
  render();

  $('addBtn').addEventListener('click', addHabit);
  $('habitInput').addEventListener('keydown', e => { if(e.key === 'Enter') addHabit(); });

  $('btnGood').addEventListener('click', () => {
    selectedType = 'good';
    $('btnGood').classList.add('active');
    $('btnBad').classList.remove('active');
  });
  $('btnBad').addEventListener('click', () => {
    selectedType = 'bad';
    $('btnBad').classList.add('active');
    $('btnGood').classList.remove('active');
  });

  $('refreshQuote').addEventListener('click', showRandomQuote);

  $('exportBtn').addEventListener('click', exportBackup);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    await handleImportFile(file);
  });

  $('confirmCancel').addEventListener('click', () => closeConfirmModal(false));
  $('confirmOk').addEventListener('click', () => closeConfirmModal(true));
  $('confirmModal').addEventListener('click', (e) => {
    if(e.target === $('confirmModal')) closeConfirmModal(false);
  });

  $('resetBtn').addEventListener('click', async () => {
    const ok = await openConfirmModal(
      'Clear all data?',
      'This will delete all your habits and history. This cannot be undone.'
    );
    if(!ok) return;
    habits = [];
    editingId = null;
    historyId = null;
    historyCursor = null;
    setBackupMsg('');
    render();
    await saveHabits();
  });
}

init();
</script>
