<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drift Habit Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Drift</h1>

    <p>Build what you want more of. Break what you don't.</p>

    <div class="habit-form">

    <label for="habit-input">New habit</label>

    <input
        id="habit-input"
        type="text"
        placeholder="e.g. Read 10 pages"
    >

    <button id="add-habit-button" type="button">
        Add Habit
    </button>

</div>

    <script src="script.js"></script>
</body>

</html>
